<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Attendance and Punctuality Monitoring Sheet</title>
        <link rel="stylesheet" type="text/css" href="attendance.css">
        <script src="attendance.js" defer></script>
    </head>
    <body>
        <section class="page">
            <header class="header">
                <img src="header.png" alt="USTP header" height=""/>
            </header>

            <h1>ATTENDANCE AND PUNCTUALITY MONITORING SHEET</h1>

            <table class="details">
                <tr>
                    <td colspan="2">
                        Office / Unit: <span id="office"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        Subject: <span id="subject"></span>
                    </td>
                    <td>
                        Class Schedule: <span id="schedule"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        Course Code: <span id="course"></span>
                    </td>
                    <td>
                        Bldg. and Room No.: <span id="building"></span>
                    </td>
                </tr>
            </table>

            <table class="attendance">
                <colgroup>
                    <col class="number-col">
                    <col class="name-col">
                    <col class="course-col">
                    <col class="check-col" span="10">
                </colgroup>
                <thead>
                    <tr>
                        <th rowspan="2">No.</th>
                        <th rowspan="2">Name of Student</th>
                        <th rowspan="2">Course &amp; Year</th>
                        <th colspan="10" class="instruction">
                            Indicate the date and put a checkmark if student is present
                        </th>
                    </tr>
                    <tr id="dateRow" class="date-row">
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="pageRows" id="page-rows"></tbody>
            </table>

            <div class="signatures">
                <div class="signature-block">
                    <div class="signature-label">Checked by:</div>
                    <div>Subject Instructor/Professor</div>
                </div>

                <div class="signature-block">
                    <div class="signature-label">Submitted to:</div>
                    <div class="submitted-date">
                        Date Submitted:<span class="blank-line"></span>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>

    <body>
        <section class="page">
            <header class="header">
                <img src="header.png" alt="USTP header" height=""/>
            </header>

            <h1>ATTENDANCE AND PUNCTUALITY MONITORING SHEET</h1>

            <table class="details">
                <tr>
                    <td colspan="2">Office / Unit:</td>
                </tr>
                <tr>
                    <td>Subject:</td>
                    <td>Class Schedule:</td>
                </tr>
                <tr>
                    <td>Course Code:</td>
                    <td>Bldg. and Room No.:</td>
                </tr>
            </table>

            <table class="attendance">
                <colgroup>
                    <col class="number-col">
                    <col class="name-col">
                    <col class="course-col">
                    <col class="check-col" span="10">
                </colgroup>
                <thead>
                    <tr>
                        <th rowspan="2">No.</th>
                        <th rowspan="2">Name of Student</th>
                        <th rowspan="2">Course &amp; Year</th>
                        <th colspan="10" class="instruction">
                            Indicate the date and put a checkmark if student is present
                        </th>
                    </tr>
                    <tr class="date-row">
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="page-rows"></tbody>
            </table>
        </section>
